name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Build WebAssembly Game with Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag
          pygbag --build main.py

      - name: Sync Game Assets to Android Project
        run: |
          npm install
          npx @capacitor/cli sync android

      - name: Build Native APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy and Rename APK
        run: |
          mkdir -p dist_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/FaithOfSurviving.apk

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaithOfSurviving-Android-APK
          path: dist_apk/FaithOfSurviving.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-android
          name: "Faith of Surviving v1.0.0 (Android APK)"
          body: |
            ## Faith of Surviving - Android APK
            
            Descarga el archivo APK directamente a tu celular Android:
            - **Archivo:** `FaithOfSurviving.apk`
            - **Controles táctiles:** Joystick virtual analógico + botones táctiles de Ataque, Esquivar, Inventario, Comer e Interactuar integrados.
            
            ### Instrucciones de instalación:
            1. Descarga el archivo `FaithOfSurviving.apk` en tu dispositivo Android.
            2. Ábrelo y selecciona **Instalar**.
            3. Si Android te solicita confirmación, activa **Permitir desde esta fuente** (Orígenes desconocidos).
            4. ¡Abre el juego y juega en modo horizontal (Landscape)!
          files: dist_apk/FaithOfSurviving.apk
