name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build WebAssembly Game with Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag
          pygbag --build main.py

      - name: Sync Game Assets to Android Project
        run: |
          npm install
          npx @capacitor/cli copy android

      - name: Build Native APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          mkdir -p dist_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/FaithOfSurviving.apk

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaithOfSurviving-Android-APK
          path: dist_apk/FaithOfSurviving.apk
