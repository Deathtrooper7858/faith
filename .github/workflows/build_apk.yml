name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build WebAssembly Game with Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag
          pygbag --build main.py

      - name: Generate Native Android Project with Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Faith of Surviving" "org.deathtrooper.faith" --web-dir "build/web"
          npx cap add android
          npx cap copy android

      - name: Configure Android Manifest for Landscape and Fullscreen
        run: |
          python -c '
          path = "android/app/src/main/AndroidManifest.xml"
          content = open(path, "r", encoding="utf-8").read()
          content = content.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\" android:theme=\"@android:style/Theme.NoTitleBar.Fullscreen\"")
          open(path, "w", encoding="utf-8").write(content)
          '

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Clarity
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/FaithOfSurviving.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaithOfSurviving-Android-APK
          path: android/app/build/outputs/apk/debug/FaithOfSurviving.apk
